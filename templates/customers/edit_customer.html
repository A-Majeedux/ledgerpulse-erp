{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}
{% block active_nav %}customers{% endblock %}
{% block content %}
<div class="lp-card" style="max-width: 960px;">
  <h2 style="margin-top:0;">Edit Customer</h2>
  <form method="POST">
    {{ csrf_field() }}
    {% include "customers/_customer_form.html" %}
    <button type="submit" class="lp-btn primary">Save Changes</button>
    <a href="{{ url_for('customers.customers_list') }}" class="lp-btn">Cancel</a>
  </form>
</div>
{% endblock %}
