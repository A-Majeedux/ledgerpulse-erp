{% extends "base.html" %}
{% block title %}New Customer Receipt{% endblock %}
{% block active_nav %}customers{% endblock %}
{% block content %}
<div class="lp-card" style="max-width: 560px;">
  <h2 style="margin-top:0;">New Customer Receipt</h2>

  {% if error %}
    <div style="background: var(--lp-coral-bg); color: var(--lp-coral-text); padding: 12px; border-radius: 8px; margin-bottom: 16px;">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label style="font-size: 13px; font-weight: 600;">Customer</label>
    <select name="customer_id" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">
      <option value="">Select customer…</option>
      {% for c in customers %}<option value="{{ c[0] }}">{{ c[1] }} ({{ c[2] }})</option>{% endfor %}
    </select>

    <label style="font-size: 13px; font-weight: 600;">Amount (gross, before any WHT deducted by the customer)</label>
    <input type="number" step="0.01" name="amount" id="amount" required oninput="recalcWht()" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Date</label>
    <input type="date" name="receipt_date" value="{{ today }}" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Memo</label>
    <input type="text" name="memo" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <input type="checkbox" name="has_wht" id="has_wht" onchange="toggleWht()"> Customer withheld tax (WHT) on this payment
    </label>
    <div id="wht-panel" style="display:none; background: var(--lp-canvas); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
      <label style="font-size: 13px; font-weight: 600;">WHT rate</label>
      <select name="wht_rate" id="wht_rate" onchange="recalcWht()" style="width:100%; padding:8px; margin: 6px 0 12px; border:1px solid var(--lp-border); border-radius:6px;">
        <option value="">Select rate…</option>
        {% for rate in tax_rates %}<option value="{{ rate[2] }}">{{ rate[1] }}</option>{% endfor %}
      </select>
      <p style="font-size: 13px; margin: 0;">WHT amount (recoverable): <strong id="wht-amount-display">0.00</strong> · Net received: <strong id="net-amount-display">0.00</strong></p>
    </div>

    <label style="font-size: 13px; font-weight: 600;">Deposit to account</label>
    <select name="deposit_to_account_id" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">
      <option value="">Select account…</option>
      {% for a in accounts %}<option value="{{ a[0] }}">{{ a[1] }} - {{ a[2] }}</option>{% endfor %}
    </select>

    <button type="submit" class="lp-btn primary">Record Receipt</button>
  </form>
</div>

<script>
function toggleWht() {
  document.getElementById('wht-panel').style.display =
    document.getElementById('has_wht').checked ? 'block' : 'none';
  recalcWht();
}
function recalcWht() {
  const amount = parseFloat(document.getElementById('amount').value || 0);
  const rate = parseFloat(document.getElementById('wht_rate').value || 0);
  const whtAmount = document.getElementById('has_wht').checked ? (amount * rate / 100) : 0;
  document.getElementById('wht-amount-display').textContent = whtAmount.toFixed(2);
  document.getElementById('net-amount-display').textContent = (amount - whtAmount).toFixed(2);
}
</script>
{% endblock %}
