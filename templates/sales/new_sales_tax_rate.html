{% extends "base.html" %}
{% block title %}New Sales Tax Rate{% endblock %}
{% block active_nav %}salestax{% endblock %}
{% block content %}
<div class="lp-card" style="max-width: 420px;">
  <h2 style="margin-top:0;">New Sales Tax Rate</h2>
  <form method="POST">
    <label style="font-size: 13px; font-weight: 600;">Label</label>
    <input type="text" name="label" placeholder="e.g. Sales Tax 18%" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Rate (%)</label>
    <input type="number" step="0.01" name="rate_percent" placeholder="18.00" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <button type="submit" class="lp-btn primary">Add Rate</button>
    <a href="{{ url_for('sales.sales_tax_rates_list') }}" class="lp-btn" style="margin-left: 8px;">Cancel</a>
  </form>
</div>
{% endblock %}
