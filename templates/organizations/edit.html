{% extends "base.html" %}
{% block title %}Edit Organization{% endblock %}
{% block content %}
<div class="lp-card" style="max-width: 640px;">
  <h2 style="margin-top:0;">Edit Organization</h2>
  <form method="POST" enctype="multipart/form-data">

    <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--lp-text-muted); margin: 20px 0 8px;">Identity</p>

    <label style="font-size: 13px; font-weight: 600;">Organization name</label>
    <input type="text" name="name" value="{{ org[1] }}" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Nature of business</label>
    <select name="nature_of_business" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">
      {% for option in ["Trading", "Manufacturing", "Distribution", "Services", "Other"] %}
        <option value="{{ option }}" {{ 'selected' if org[3] == option }}>{{ option }}</option>
      {% endfor %}
    </select>

    {% if org[8] %}
      <img src="/{{ org[8] }}" alt="Current logo" style="height: 48px; display:block; margin-bottom: 8px;">
    {% endif %}
    <label style="font-size: 13px; font-weight: 600;">Logo {% if org[8] %}(upload a new one to replace it){% endif %}</label>
    <input type="file" name="logo" accept="image/*" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--lp-text-muted); margin: 20px 0 8px;">Registration</p>

    <label style="font-size: 13px; font-weight: 600;">NTN</label>
    <input type="text" name="ntn" value="{{ org[4] or '' }}" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">STRN / GST Number</label>
    <input type="text" name="strn" value="{{ org[5] or '' }}" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--lp-text-muted); margin: 20px 0 8px;">Addresses</p>

    <label style="font-size: 13px; font-weight: 600;">Head Office address</label>
    <textarea name="head_office_address" rows="2" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px; font-family:inherit;">{{ org[6] or '' }}</textarea>

    <label style="font-size: 13px; font-weight: 600;">Warehouse address</label>
    <textarea name="warehouse_address" rows="2" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px; font-family:inherit;">{{ org[7] or '' }}</textarea>

    <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--lp-text-muted); margin: 20px 0 8px;">Financial Settings</p>

    <label style="font-size: 13px; font-weight: 600;">Currency</label>
    <input type="text" name="currency" value="{{ org[2] }}" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Fiscal year starts in</label>
    <select name="fiscal_year_start_month" style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">
      {% for i in range(1, 13) %}
        <option value="{{ i }}" {{ 'selected' if i == org[9] }}>{{ month_names[i-1] }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="lp-btn primary" style="margin-top: 8px;">Save Changes</button>
    <a href="{{ url_for('organizations.manage_organizations') }}" class="lp-btn" style="margin-top: 8px;">Cancel</a>
  </form>
</div>
{% endblock %}
