{% extends "base.html" %}
{% block title %}New Tax Rate{% endblock %}
{% block active_nav %}taxrates{% endblock %}
{% block content %}
<div class="lp-card" style="max-width: 420px;">
  <h2 style="margin-top:0;">New Tax Rate</h2>
  <form method="POST">
    <label style="font-size: 13px; font-weight: 600;">Label</label>
    <input type="text" name="label" placeholder="e.g. WHT 7.5%" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <label style="font-size: 13px; font-weight: 600;">Rate (%)</label>
    <input type="number" step="0.01" name="rate_percent" required style="width:100%; padding:8px; margin: 6px 0 16px; border:1px solid var(--lp-border); border-radius:6px;">

    <button type="submit" class="lp-btn primary">Add Rate</button>
  </form>
</div>
{% endblock %}
